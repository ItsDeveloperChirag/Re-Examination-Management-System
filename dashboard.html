<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>ExamFlowMaster - Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="brand"><div class="logo">EF</div><div>IPU Re-Exam</div></div>
      <nav class="nav">
        <a data-href="dashboard.html">Dashboard</a>
        <a data-href="apply.html">Apply for Re-exam</a>
        <a data-href="applications.html">My Applications</a>
        <a data-href="payments.html">Payments</a>
        <a data-href="results.html">Results</a>
        <a data-href="pyq.html">PYQ Papers</a>
        <a data-href="notices.html">Notices</a>
      </nav>
      <div class="user">
        <div class="avatar">A</div>
        <div><div class="name">Amit Kumar</div><div class="small-muted">Student</div></div>
        <div style="margin-left:auto"><button class="logout">Logout</button></div>
      </div>
    </aside>
    <main class="main">
      <div class="header-row">
        <div class="page-title">Dashboard</div>
        <div>
          <button class="btn secondary" onclick="alert('This is a frontend-only demo')">Download Result</button>
        </div>
      </div>
      <div id="dashboard-area">
        
<div id="dashboard-root">
  <div class="cards">
    <div class="card small">
      <div class="small-muted">Pending Applications</div>
      <div style="font-size:20px;font-weight:700;margin-top:8px" id="pendingApps">0</div>
    </div>
    <div class="card small">
      <div class="small-muted">Total Payments</div>
      <div style="font-size:20px;font-weight:700;margin-top:8px" id="totalPayments">₹0</div>
    </div>
    <div class="card small">
      <div class="small-muted">Upcoming Exams</div>
      <div style="font-size:20px;font-weight:700;margin-top:8px" id="upcomingExams">0</div>
    </div>
    <div class="card small">
      <div class="small-muted">Results Published</div>
      <div style="font-size:20px;font-weight:700;margin-top:8px" id="resultsPublished">0</div>
    </div>
  </div>

  <div style="display:flex;gap:18px;align-items:flex-start">
    <div style="flex:1">
      <div class="card">
        <div style="font-weight:700">Quick Actions</div>
        <div class="quick-actions">
          <button class="btn" onclick="window.location.href='apply.html'">Apply for Re-examination</button>
          <button class="btn secondary" onclick="window.location.href='results.html'">View Results</button>
          <button class="btn secondary" onclick="window.location.href='payments.html'">Payments</button>
        </div>
      </div>
      <div id="noticesWrap" style="margin-top:12px"></div>
    </div>

    <div style="width:360px">
      <div class="card">
        <div style="font-weight:700">Application Status</div>
        <div class="small-muted" style="margin-top:10px">Form Submitted · Payment · Verification · Admit Card · Result</div>
      </div>
    </div>
  </div>
</div>

      </div>
    </main>
  </div>
<script src="assets/js/script.js"></script>
</body>
</html>
