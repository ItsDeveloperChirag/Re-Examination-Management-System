<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>ExamFlowMaster - Examination Results</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="brand"><div class="logo">EF</div><div>IPU Re-Exam</div></div>
      <nav class="nav">
        <a data-href="dashboard.html">Dashboard</a>
        <a data-href="apply.html">Apply for Re-exam</a>
        <a data-href="applications.html">My Applications</a>
        <a data-href="payments.html">Payments</a>
        <a data-href="results.html">Results</a>
        <a data-href="pyq.html">PYQ Papers</a>
        <a data-href="notices.html">Notices</a>
      </nav>
      <div class="user">
        <div class="avatar">A</div>
        <div><div class="name">Amit Kumar</div><div class="small-muted">Student</div></div>
        <div style="margin-left:auto"><button class="logout">Logout</button></div>
      </div>
    </aside>
    <main class="main">
      <div class="header-row">
        <div class="page-title">Examination Results</div>
        <div>
          <button class="btn secondary" onclick="alert('This is a frontend-only demo')">Download Result</button>
        </div>
      </div>
      <div id="results-area">
        
<div id="results-root">
  <div class="cards">
    <div class="card small"><div class="small-muted">Total Marks</div><div id="totalMarks" style="font-weight:700">0</div></div>
    <div class="card small"><div class="small-muted">Average</div><div id="average" style="font-weight:700">0</div></div>
    <div class="card small"><div class="small-muted">Status</div><div id="status" style="font-weight:700">-</div></div>
  </div>
  <div class="table">
    <table>
      <thead><tr><th>Subject Code</th><th>Subject Name</th><th>Internal</th><th>External</th><th>Total</th><th>Grade</th><th>Status</th></tr></thead>
      <tbody id="results-table-body"></tbody>
    </table>
  </div>
</div>

      </div>
    </main>
  </div>
<script src="assets/js/script.js"></script>
</body>
</html>
