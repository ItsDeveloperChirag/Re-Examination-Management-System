<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>ExamFlowMaster - Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div class="logo" style="width:56px;height:56px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">EF</div>
        <div>
          <div style="font-size:20px;font-weight:800">IPU Re-Exam</div>
          <div class="small-muted">Management System — Frontend Demo</div>
        </div>
      </div>
      <form id="login-form">
        <div class="form-row">
          <label class="small-muted">Student ID</label>
          <input id="studentId" class="input" placeholder="Enter Student ID (e.g. AK2025)"/>
        </div>
        <div class="form-row">
          <label class="small-muted">Password</label>
          <input id="password" type="password" class="input" placeholder="Enter password"/>
        </div>
        <div class="form-row" style="margin-top:18px;">
          <button class="btn" type="submit">Login</button>
          <button type="button" class="btn secondary" style="margin-left:10px" onclick="alert('Demo: any creds work')">Help</button>
        </div>
      </form>
    </div>
  </div>
<script src="assets/js/script.js"></script>
</body>
</html>
